<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فیزیک‌یار | آموزش فیزیک دهم، یازدهم، دوازدهم و کنکور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b1f52">
<style>
  :root{
    --navy:#0b1f52;
    --navy-2:#123a8c;
    --paper:#F6F2E9;
    --paper-2:#EDE6D6;
    --ink:#20242c;
    --ink-soft:#5b6270;
    --amber:#f6c14c;
    --amber-deep:#d99a1f;
    --teal:#0d6ab0;
    --red:#C24444;
    --green:#3E8B5B;
    --line:#DCD3BE;
    --radius:10px;
    --shadow:0 6px 20px rgba(19,34,56,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn',sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.7;
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer;}
  h1,h2,h3,h4{margin:0;font-weight:700;}
  a{color:inherit;}

  /* ---------- Header ---------- */
  header.topbar{
    background:var(--navy);
    color:#fff;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:40;
    box-shadow:0 2px 12px rgba(0,0,0,0.15);
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;letter-spacing:.2px;}
  .brand .mark{
    width:36px;height:36px;border-radius:9px;
    overflow:hidden;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .brand .mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .icon-btn{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    color:#fff;border-radius:8px;
    padding:8px 14px;font-size:14px;
    display:flex;align-items:center;gap:6px;
    transition:background .15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.16);}
  .cart-count{
    background:var(--amber);color:var(--navy);
    border-radius:999px;min-width:19px;height:19px;
    font-size:11px;font-weight:800;
    display:inline-flex;align-items:center;justify-content:center;
    padding:0 4px;
  }

  /* ---------- Breadcrumb ---------- */
  .crumbbar{
    background:var(--paper-2);
    border-bottom:1px solid var(--line);
    padding:10px 22px;
    font-size:13.5px;
    color:var(--ink-soft);
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  }
  .crumb-btn{
    background:none;border:none;color:var(--teal);font-weight:600;
    padding:2px 4px;font-size:13.5px;
  }
  .crumb-btn:hover{text-decoration:underline;}
  .crumb-sep{color:#b6ac93;}
  .crumb-current{color:var(--ink);font-weight:700;}

  main{max-width:1080px;margin:0 auto;padding:26px 20px 70px;}

  .page-head{margin-bottom:22px;}
  .page-head .eyebrow{color:var(--teal);font-weight:700;font-size:13.5px;margin-bottom:4px;}
  .page-head h2{font-size:24px;color:var(--navy);}
  .page-head p{color:var(--ink-soft);font-size:14.5px;margin-top:6px;max-width:560px;}

  /* ---------- Choice grid (rasheh / grade / chapter / section) ---------- */
  .choice-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:16px;
  }
  .choice-card{
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:22px 20px;
    text-align:right;
    transition:transform .12s, box-shadow .12s, border-color .12s;
    position:relative;
    overflow:hidden;
  }
  .choice-card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow);
    border-color:var(--amber);
  }
  .choice-card .num{
    position:absolute; inset-inline-start:14px; top:14px;
    width:30px;height:30px;border-radius:8px;
    background:var(--paper-2);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--navy-2);
  }
  .choice-card h3{font-size:17px;color:var(--navy);margin-bottom:6px;padding-inline-start:38px;}
  .choice-card p{font-size:13px;color:var(--ink-soft);margin:0;padding-inline-start:38px;}
  .choice-card .clip-badge{
    display:inline-block;margin-top:10px;
    background:var(--paper-2);color:var(--ink-soft);
    border-radius:6px;padding:3px 8px;font-size:12px;
  }

  /* ---------- Clip list ---------- */
  .clip-card{
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:14px;
    display:flex;
    gap:16px;
    align-items:flex-start;
  }
  .clip-wave{
    flex:none;width:64px;height:64px;border-radius:10px;
    background:linear-gradient(160deg,var(--navy),var(--navy-2));
    display:flex;align-items:center;justify-content:center;
    color:var(--amber);
  }
  .clip-body{flex:1;min-width:0;}
  .clip-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;}
  .clip-top h4{font-size:16px;color:var(--ink);}
  .clip-meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;}
  .price-tag{font-weight:800;font-size:15px;color:var(--navy);white-space:nowrap;}
  .price-tag.free{color:var(--green);}
  .clip-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

  .btn{
    border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600;
    border:1.5px solid transparent;transition:opacity .15s, background .15s;
  }
  .btn-primary{background:var(--amber);color:var(--navy);}
  .btn-primary:hover{background:var(--amber-deep);}
  .btn-outline{background:#fff;border-color:var(--line);color:var(--navy-2);}
  .btn-outline:hover{border-color:var(--teal);color:var(--teal);}
  .btn-ghost{background:none;border:none;color:var(--teal);font-weight:600;padding:8px 4px;}
  .btn-success{background:var(--green);color:#fff;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .pdf-row{
    margin-top:10px;background:var(--paper-2);border-radius:8px;
    padding:8px 12px;font-size:13px;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }

  .player-box{
    margin-top:12px;background:var(--navy);border-radius:10px;
    padding:26px 16px;text-align:center;color:#fff;
  }
  .player-box .ptitle{font-size:13px;color:#c9d3e0;margin-bottom:8px;}
  .player-box .fake-progress{
    height:6px;background:rgba(255,255,255,.18);border-radius:99px;margin:14px auto;max-width:340px;overflow:hidden;
  }
  .player-box .fake-progress span{display:block;height:100%;width:38%;background:var(--amber);}

  /* ---------- Cart drawer ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(19,34,56,0.45);
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;bottom:0;left:0;
    width:min(380px,88vw);background:#fff;
    z-index:70;box-shadow:8px 0 30px rgba(0,0,0,.18);
    transform:translateX(-100%);transition:transform .25s ease;
    display:flex;flex-direction:column;
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .drawer-head h3{font-size:16px;color:var(--navy);}
  .drawer-close{background:none;border:none;font-size:18px;color:var(--ink-soft);}
  .drawer-body{flex:1;overflow-y:auto;padding:14px 20px;}
  .drawer-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line);}
  .drawer-item .ttl{font-size:13.5px;color:var(--ink);}
  .drawer-item .sub{font-size:11.5px;color:var(--ink-soft);}
  .drawer-item .rm{background:none;border:none;color:var(--red);font-size:12px;}
  .drawer-foot{padding:16px 20px;border-top:1px solid var(--line);}
  .drawer-total{display:flex;justify-content:space-between;font-weight:700;color:var(--navy);margin-bottom:12px;font-size:15px;}
  .empty-note{color:var(--ink-soft);font-size:13.5px;text-align:center;padding:30px 10px;}

  /* ---------- Modal ---------- */
  .modal{
    position:fixed;inset:0;z-index:80;display:none;
    align-items:center;justify-content:center;padding:16px;
  }
  .modal.show{display:flex;}
  .modal-back{position:absolute;inset:0;background:rgba(19,34,56,0.55);}
  .modal-card{
    position:relative;background:#fff;border-radius:12px;
    max-width:420px;width:100%;padding:26px 24px;box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal-card h3{font-size:18px;color:var(--navy);margin-bottom:6px;}
  .modal-card p{font-size:13.5px;color:var(--ink-soft);margin-bottom:16px;}
  .modal-close{position:absolute;top:14px;left:14px;background:none;border:none;font-size:16px;color:var(--ink-soft);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;}
  .field input{
    width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;
    font-family:inherit;font-size:14px;background:var(--paper);
  }
  .field input:focus{outline:2px solid var(--teal);outline-offset:1px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--navy);color:#fff;padding:11px 20px;border-radius:9px;
    font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:100;
    box-shadow:0 10px 24px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  footer.demo-note{
    text-align:center;color:var(--ink-soft);font-size:12px;
    padding:18px;border-top:1px solid var(--line);background:var(--paper-2);
  }
  @media(max-width:560px){
    .clip-card{flex-direction:column;}
    .clip-wave{width:100%;height:44px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark"><img src="icon-192.png" alt="فیزیک‌یار"></span> فیزیک‌یار</div>
  <div class="topbar-actions">
    <button class="icon-btn" onclick="openProfile()">👤 <span id="profileLabel">ورود / پروفایل</span></button>
    <button class="icon-btn" onclick="openCart()">🛒 سبد خرید <span class="cart-count" id="cartCount">0</span></button>
  </div>
</header>

<nav class="crumbbar" id="crumbbar"></nav>

<main id="main"></main>

<footer class="demo-note">
  فیزیک‌یار — آموزش فیزیک دهم، یازدهم، دوازدهم و کنکور
</footer>

<!-- Cart Drawer -->
<div class="overlay" id="overlay" onclick="closeAllOverlays()"></div>
<div class="drawer" id="cartDrawer">
  <div class="drawer-head"><h3>سبد خرید</h3><button class="drawer-close" onclick="closeAllOverlays()">✕</button></div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot" id="cartFoot"></div>
</div>

<!-- Login/Register Modal -->
<div class="modal" id="loginModal">
  <div class="modal-back" onclick="closeModal('loginModal')"></div>
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal('loginModal')">✕</button>
    <h3 id="authTitle">ورود به حساب کاربری</h3>
    <p>برای مشاهدهٔ خریدها و تکمیل خرید، وارد شوید یا ثبت‌نام کنید.</p>
    <div class="field" id="authNameField"><label>نام و نام خانوادگی</label><input id="loginName" placeholder="مثلاً: علی رضایی"></div>
    <div class="field"><label>شماره موبایل</label><input id="loginPhone" placeholder="09xxxxxxxxx"></div>
    <div class="field"><label>رمز عبور</label><input id="loginPassword" type="password"></div>
    <button class="btn btn-primary" style="width:100%;padding:11px;" id="authSubmitBtn" onclick="doLogin()">ورود</button>
    <button class="btn-ghost" style="width:100%;margin-top:8px;" onclick="toggleAuthMode()" id="authSwitchBtn">حساب ندارید؟ ثبت‌نام کنید</button>
    <div class="status-msg" id="authStatus" style="color:var(--red);font-size:13px;margin-top:8px;"></div>
  </div>
</div>

<!-- Profile Modal -->
<div class="modal" id="profileModal">
  <div class="modal-back" onclick="closeModal('profileModal')"></div>
  <div class="modal-card" style="max-width:460px;">
    <button class="modal-close" onclick="closeModal('profileModal')">✕</button>
    <h3>پروفایل من</h3>
    <div id="profileBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG ============ */
const API_BASE = "https://physics-yar.ir/api";

/* ============ APP STATE ============ */
let CATALOG = null;              // fetched from /api/catalog
let state = { majorId:null, gradeId:null, chapterId:null, sectionId:null };
let cartItems = [];              // [{clip_id, title, price, is_free}]
let user = JSON.parse(localStorage.getItem("py_user") || "null");
let token = localStorage.getItem("py_token") || null;
let authMode = "login";          // "login" | "register"

function toToman(n){ return n===0 ? "رایگان" : n.toLocaleString('fa-IR') + " تومان"; }

/* ============ API HELPER ============ */
async function api(path, options = {}) {
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: "Bearer " + token } : {}),
      ...(options.headers || {})
    }
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || "خطا در ارتباط با سرور");
  return data;
}

async function loadCatalog(){
  const main = document.getElementById('main');
  main.innerHTML = `<div class="page-head"><p>در حال بارگذاری محتوا…</p></div>`;
  try{
    CATALOG = (await api("/catalog")).majors;
    if(token) await loadCart();
    render();
  }catch(e){
    main.innerHTML = `<div class="page-head"><p style="color:var(--red);">خطا در بارگذاری محتوا: ${e.message}</p></div>`;
  }
}

async function loadCart(){
  try{
    const data = await api("/cart");
    cartItems = data.items || [];
  }catch(e){ cartItems = []; }
  renderCartBadge();
}

/* ============ NAV / RENDER ============ */
function go(next){ state = {...state, ...next}; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function resetToHome(){ state = { majorId:null, gradeId:null, chapterId:null, sectionId:null }; render(); }

function findMajor(id){ return CATALOG.find(m=>m.id===id); }
function findGrade(major,id){ return major.grades.find(g=>g.id===id); }
function findChapter(grade,id){ return grade.chapters.find(c=>c.id===id); }
function findSection(chapter,id){ return chapter.sections.find(s=>s.id===id); }

function renderCrumb(){
  const bar = document.getElementById('crumbbar');
  const parts = [`<button class="crumb-btn" onclick="resetToHome()">خانه</button>`];
  const major = state.majorId ? findMajor(state.majorId) : null;
  const grade = major && state.gradeId ? findGrade(major, state.gradeId) : null;
  const chapter = grade && state.chapterId ? findChapter(grade, state.chapterId) : null;
  const section = chapter && state.sectionId ? findSection(chapter, state.sectionId) : null;

  if(major){
    parts.push(`<span class="crumb-sep">›</span>`);
    parts.push(grade ? `<button class="crumb-btn" onclick="go({gradeId:null,chapterId:null,sectionId:null})">${major.title}</button>` : `<span class="crumb-current">${major.title}</span>`);
  }
  if(grade){
    parts.push(`<span class="crumb-sep">›</span>`);
    parts.push(chapter ? `<button class="crumb-btn" onclick="go({chapterId:null,sectionId:null})">پایه ${grade.title}</button>` : `<span class="crumb-current">پایه ${grade.title}</span>`);
  }
  if(chapter){
    parts.push(`<span class="crumb-sep">›</span>`);
    parts.push(section ? `<button class="crumb-btn" onclick="go({sectionId:null})">${chapter.title}</button>` : `<span class="crumb-current">${chapter.title}</span>`);
  }
  if(section){
    parts.push(`<span class="crumb-sep">›</span>`);
    parts.push(`<span class="crumb-current">${section.title}</span>`);
  }
  bar.innerHTML = parts.join(' ');
}

function render(){
  renderCrumb();
  const main = document.getElementById('main');
  if(!CATALOG){ main.innerHTML = `<div class="page-head"><p>در حال بارگذاری…</p></div>`; return; }
  if(!state.majorId){ main.innerHTML = renderMajorPicker(); return; }
  const major = findMajor(state.majorId);
  if(!state.gradeId){ main.innerHTML = renderGradePicker(major); return; }
  const grade = findGrade(major, state.gradeId);
  if(!state.chapterId){ main.innerHTML = renderChapterPicker(major, grade); return; }
  const chapter = findChapter(grade, state.chapterId);
  if(!state.sectionId){ main.innerHTML = renderSectionPicker(chapter); return; }
  const section = findSection(chapter, state.sectionId);
  main.innerHTML = renderClipList(chapter, section);
}

function renderMajorPicker(){
  if(CATALOG.length===0) return `<div class="page-head"><p>هنوز محتوایی اضافه نشده.</p></div>`;
  const cards = CATALOG.map((m,i)=>`
    <button class="choice-card" style="cursor:pointer;width:100%;font-family:inherit;" onclick='go({majorId:${m.id}})'>
      <div class="num">${i+1}</div>
      <h3>${m.title}</h3>
      <p>مسیر پایه‌های دهم تا دوازدهم ${m.title}</p>
    </button>`).join('');
  return `
    <div class="page-head">
      <div class="eyebrow">شروع کنید</div>
      <h2>رشتهٔ تحصیلی خود را انتخاب کنید</h2>
      <p>بر اساس رشته‌تان، محتوای فیزیک متناسب همان مسیر به شما نمایش داده می‌شود.</p>
    </div>
    <div class="choice-grid">${cards}</div>`;
}

function renderGradePicker(major){
  if(major.grades.length===0) return `<div class="page-head"><p>هنوز پایه‌ای برای این رشته اضافه نشده.</p></div>`;
  const cards = major.grades.map((g,i)=>`
    <button class="choice-card" style="cursor:pointer;width:100%;font-family:inherit;" onclick='go({gradeId:${g.id}})'>
      <div class="num">${i+1}</div>
      <h3>پایهٔ ${g.title}</h3>
      <p>${g.chapters.length} فصل آموزشی</p>
    </button>`).join('');
  return `
    <div class="page-head">
      <div class="eyebrow">${major.title}</div>
      <h2>پایهٔ تحصیلی را انتخاب کنید</h2>
    </div>
    <div class="choice-grid">${cards}</div>`;
}

function renderChapterPicker(major, grade){
  if(grade.chapters.length===0) return `<div class="page-head"><p>هنوز فصلی برای این پایه اضافه نشده.</p></div>`;
  const cards = grade.chapters.map((ch,i)=>{
    const clipCount = ch.sections.reduce((s,sec)=>s+sec.clips.length,0);
    return `<button class="choice-card" style="cursor:pointer;width:100%;font-family:inherit;" onclick='go({chapterId:${ch.id}})'>
      <div class="num">${i+1}</div>
      <h3>${ch.title}</h3>
      <p>${ch.sections.length} بخش · ${clipCount} کلیپ</p>
    </button>`;
  }).join('');
  return `
    <div class="page-head">
      <div class="eyebrow">پایهٔ ${grade.title} · ${major.title}</div>
      <h2>فصل مورد نظر را انتخاب کنید</h2>
    </div>
    <div class="choice-grid">${cards}</div>`;
}

function renderSectionPicker(chapter){
  if(chapter.sections.length===0) return `<div class="page-head"><p>هنوز بخشی برای این فصل اضافه نشده.</p></div>`;
  const cards = chapter.sections.map((sec,i)=>`
    <button class="choice-card" style="cursor:pointer;width:100%;font-family:inherit;" onclick='go({sectionId:${sec.id}})'>
      <div class="num">${i+1}</div>
      <h3>${sec.title}</h3>
      <p>${sec.clips.length} کلیپ آموزشی</p>
    </button>`).join('');
  return `
    <div class="page-head">
      <div class="eyebrow">${chapter.title}</div>
      <h2>بخش مورد نظر را انتخاب کنید</h2>
    </div>
    <div class="choice-grid">${cards}</div>`;
}

function renderClipList(chapter, section){
  if(section.clips.length===0) return `<div class="page-head"><p>هنوز کلیپی برای این بخش اضافه نشده.</p></div>`;
  const items = section.clips.map(clip => renderClipCard(clip)).join('');
  return `
    <div class="page-head">
      <div class="eyebrow">${chapter.title}</div>
      <h2>${section.title}</h2>
      <p>پیش‌نمایش هر کلیپ همیشه رایگان قابل دانلود است. نسخهٔ کامل را می‌توانید بعد از خرید دانلود کنید.</p>
    </div>
    ${items}`;
}

function renderClipCard(clip){
  const owned = clip.owned;
  const inCart = cartItems.some(it=>it.clip_id===clip.id);

  const previewBtn = `<button class="btn btn-outline" onclick="downloadClip(${clip.id},'preview')">⬇ دانلود پیش‌نمایش (رایگان)</button>`;

  let fullBtn = '';
  if(owned){
    fullBtn = `<button class="btn btn-success" onclick="downloadClip(${clip.id},'full')">⬇ دانلود کلیپ کامل</button>`;
  } else {
    fullBtn = `<button class="btn ${inCart?'btn-outline':'btn-primary'}" onclick="toggleCart(${clip.id})">${inCart?'حذف از سبد':'افزودن به سبد خرید'}</button>`;
  }

  const priceHtml = `<span class="price-tag ${clip.isFree?'free':''}">${toToman(clip.price)}</span>`;
  let pdfHtml = '';
  if(clip.hasPdf){
    if(owned){
      pdfHtml = `<div class="pdf-row"><span>📄 جزوهٔ همراه کلیپ</span><button class="btn btn-outline" onclick="downloadClip(${clip.id},'pdf')">دانلود PDF</button></div>`;
    } else {
      pdfHtml = `<div class="pdf-row"><span>📄 این کلیپ همراه با جزوهٔ PDF است</span><span style="color:var(--ink-soft);">پس از خرید قابل دانلود</span></div>`;
    }
  }
  return `
    <div class="clip-card">
      <div class="clip-wave">🎬</div>
      <div class="clip-body">
        <div class="clip-top">
          <h4>${clip.title}</h4>
          ${priceHtml}
        </div>
        <div class="clip-meta">
          ${clip.duration? `<span>⏱ ${clip.duration}</span>` : ''}
          ${clip.isFree? '<span style="color:var(--green);font-weight:600;">کاملاً رایگان</span>' : ''}
          ${clip.hasPdf? '<span>📄 شامل جزوه</span>' : ''}
        </div>
        <div class="clip-actions">${previewBtn}${fullBtn}</div>
        ${pdfHtml}
      </div>
    </div>`;
}

/* ============ CART ============ */
async function toggleCart(clipId){
  if(!token){ closeAllOverlays(); openProfile(); showToast("ابتدا وارد حساب کاربری شوید"); return; }
  const inCart = cartItems.some(it=>it.clip_id===clipId);
  try{
    if(inCart) await api("/cart/"+clipId, { method:"DELETE" });
    else await api("/cart", { method:"POST", body: JSON.stringify({ clipId }) });
    await loadCart();
    render();
    showToast(inCart ? "از سبد خرید حذف شد" : "به سبد خرید اضافه شد");
  }catch(e){ showToast(e.message); }
}
function openCart(){ renderCartDrawer(); document.getElementById('overlay').classList.add('show'); document.getElementById('cartDrawer').classList.add('show'); }
function closeAllOverlays(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('cartDrawer').classList.remove('show');
}
function renderCartBadge(){ document.getElementById('cartCount').textContent = cartItems.length; }
function renderCartDrawer(){
  renderCartBadge();
  const body = document.getElementById('cartBody');
  const foot = document.getElementById('cartFoot');
  if(cartItems.length===0){
    body.innerHTML = `<div class="empty-note">سبد خرید شما خالی است.<br>یک کلیپ آموزشی انتخاب کنید تا اینجا اضافه شود.</div>`;
    foot.innerHTML = '';
    return;
  }
  let total = 0;
  body.innerHTML = cartItems.map(it=>{
    total += it.price;
    return `<div class="drawer-item">
      <div><div class="ttl">${it.title}</div><div class="sub">${toToman(it.price)}</div></div>
      <button class="rm" onclick="toggleCart(${it.clip_id})">حذف</button>
    </div>`;
  }).join('');
  foot.innerHTML = `
    <div class="drawer-total"><span>جمع کل</span><span>${toToman(total)}</span></div>
    <button class="btn btn-primary" style="width:100%;padding:12px;" onclick="startCheckout()">ادامه و پرداخت</button>`;
}

/* ============ AUTH ============ */
function openProfile(){
  if(!user){ toggleAuthMode('login'); document.getElementById('loginModal').classList.add('show'); return; }
  renderProfileBody();
  document.getElementById('profileModal').classList.add('show');
}
function toggleAuthMode(mode){
  authMode = mode === 'register' || mode === 'login' ? mode : (authMode==='login'?'register':'login');
  const isLogin = authMode === 'login';
  document.getElementById('authTitle').textContent = isLogin ? 'ورود به حساب کاربری' : 'ساخت حساب کاربری';
  document.getElementById('authNameField').style.display = isLogin ? 'none' : 'block';
  document.getElementById('authSubmitBtn').textContent = isLogin ? 'ورود' : 'ثبت‌نام';
  document.getElementById('authSubmitBtn').setAttribute('onclick', isLogin ? 'doLogin()' : 'doRegister()');
  document.getElementById('authSwitchBtn').textContent = isLogin ? 'حساب ندارید؟ ثبت‌نام کنید' : 'حساب دارید؟ وارد شوید';
  document.getElementById('authStatus').textContent = '';
}
async function doLogin(){
  const phone = document.getElementById('loginPhone').value.trim();
  const password = document.getElementById('loginPassword').value;
  const statusEl = document.getElementById('authStatus');
  if(!phone || !password){ statusEl.textContent = "شماره موبایل و رمز عبور را وارد کنید"; return; }
  try{
    const data = await api("/auth/login", { method:"POST", body: JSON.stringify({ phone, password }) });
    afterAuth(data);
  }catch(e){ statusEl.textContent = e.message; }
}
async function doRegister(){
  const fullName = document.getElementById('loginName').value.trim();
  const phone = document.getElementById('loginPhone').value.trim();
  const password = document.getElementById('loginPassword').value;
  const statusEl = document.getElementById('authStatus');
  if(!fullName || !phone || !password){ statusEl.textContent = "همهٔ فیلدها را پر کنید"; return; }
  try{
    const data = await api("/auth/register", { method:"POST", body: JSON.stringify({ fullName, phone, password }) });
    afterAuth(data);
  }catch(e){ statusEl.textContent = e.message; }
}
function afterAuth(data){
  token = data.token; user = data.user;
  localStorage.setItem("py_token", token);
  localStorage.setItem("py_user", JSON.stringify(user));
  document.getElementById('profileLabel').textContent = user.fullName;
  closeModal('loginModal');
  showToast("خوش آمدید، " + user.fullName);
  loadCatalog();
}
function logout(){
  token = null; user = null;
  localStorage.removeItem("py_token"); localStorage.removeItem("py_user");
  cartItems = [];
  document.getElementById('profileLabel').textContent = 'ورود / پروفایل';
  closeModal('profileModal');
  showToast("از حساب خارج شدید");
  loadCatalog();
}
function renderProfileBody(){
  const body = document.getElementById('profileBody');
  body.innerHTML = `
    <p style="margin-bottom:4px;"><b>${user.fullName}</b></p>
    <p style="margin-top:0;">${user.phone}</p>
    <button class="btn btn-outline" style="width:100%;margin-bottom:14px;" onclick="logout()">خروج از حساب</button>
    <h4 style="margin:16px 0 8px;color:var(--navy);font-size:14.5px;">سبد خرید (${cartItems.length})</h4>
    ${cartItems.length? `<button class="btn btn-outline" style="width:100%;" onclick="closeModal('profileModal');openCart()">مشاهده سبد خرید</button>` : '<div class="empty-note">سبد خرید خالی است.</div>'}
  `;
}

/* ============ CHECKOUT / PAYMENT ============ */
async function startCheckout(){
  if(cartItems.length===0) return;
  try{
    const data = await api("/payment/request", { method:"POST" });
    window.location.href = data.paymentUrl;
  }catch(e){ showToast(e.message); }
}

/* ============ DOWNLOAD ============ */
async function downloadClip(clipId, type){
  try{
    const data = await api(`/clips/${clipId}/download?type=${type}`);
    window.location.href = data.url;
  }catch(e){ showToast(e.message); }
}

/* ============ UI HELPERS ============ */
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ============ INIT ============ */
if(user) document.getElementById('profileLabel').textContent = user.fullName;
toggleAuthMode('login');

const urlParams = new URLSearchParams(window.location.search);
const paymentStatus = urlParams.get('payment');
if(paymentStatus){
  const messages = {
    success: "پرداخت با موفقیت انجام شد! کلیپ‌ها به حساب شما اضافه شدند.",
    cancelled: "پرداخت لغو شد.",
    failed: "پرداخت ناموفق بود.",
    error: "خطایی در پرداخت رخ داد."
  };
  window.history.replaceState({}, '', window.location.pathname);
  setTimeout(()=>showToast(messages[paymentStatus] || ""), 400);
}

loadCatalog();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
